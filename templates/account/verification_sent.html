{% extends "base.html" %}

{% block content %}
<div class="auth-content">
    <h2 class="auth-title">Confirm Your Email</h2>
    <p class="auth-text">
        We've sent a confirmation link to your email address. Click the link to
        activate your account, then come back and log in.
    </p>
    <p class="auth-alt">
        <a href="{% url 'account_login' %}">Back to log in</a>
    </p>
</div>
{% endblock %}
